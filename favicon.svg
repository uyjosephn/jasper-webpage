<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app's JasperMark, facet for facet (components/icons.tsx). A cut
       stone: one bright face catching the light, the rest falling away into
       shadow. Kept as SVG so it stays sharp at any size and weighs nothing. -->
  <rect width="100" height="100" rx="18" fill="#26110a"/>
  <polygon points="48,46 50,12 78,30" fill="#eeb05a"/>
  <polygon points="48,46 78,30 82,58" fill="#d97a3b"/>
  <polygon points="48,46 82,58 58,88" fill="#b2401f"/>
  <polygon points="48,46 58,88 32,82" fill="#7c2415"/>
  <polygon points="48,46 32,82 16,52" fill="#4a160d"/>
  <polygon points="48,46 16,52 28,26" fill="#8f2e19"/>
  <polygon points="48,46 28,26 50,12" fill="#c7602e"/>
</svg>
